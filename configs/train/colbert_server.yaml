# 原始 ColBERT 训练参数，仅将数据、模型输出和日志路径改为项目内相对路径。
# 请从服务器上的 multi-vector 根目录启动。
model:
  model_name: colbert
  pretrained_model: bert-base-uncased
  dim: 128
  qry_maxlen: 32
  doc_maxlen: 300
  temp: 0.2

data:
  train:
    triples_path: ./data/msmarco/train/hard_negatives_32.tsv
    queries_path: ./data/msmarco/train/queries.tsv
    corpus_path: ./data/msmarco/collection.tsv
    nway: 1
  eval:
    qrels_path: ./data/nanobeir_merged/qrels/test.tsv
    queries_path: ./data/nanobeir_merged/queries.jsonl
    corpus_path: ./data/nanobeir_merged/corpus.jsonl

training:
  gather_across_devices: true
  score_margins: false
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  fp16: True
  bf16: False
  early_stopping_patience: 1000000
  report_to: wandb
  wandb_project: multi-vector
  run_name: colbert_0927
  output_dir: ./checkpoints/colbert_0927/states
  num_train_epochs: 4
  learning_rate: 2.0e-5
  warmup_steps: 1000
  per_device_train_batch_size: 128
  per_device_eval_batch_size: 256
  weight_decay: 0.01
  seed: 42
  dataloader_num_workers: 4
  eval_steps: 500
  save_steps: 500
  logging_steps: 50
  logging_dir: ./logs/colbert_0927
  # resume_from_checkpoint: true
